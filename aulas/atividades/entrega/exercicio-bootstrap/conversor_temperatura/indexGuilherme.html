<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de temperatura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styleGuilherme.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card mx-auto">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Conversor de Temperatura</h2>
                <form class="form-conversor">
                    <div class="mb-3">
                        <label for="temperatura" class="form-label">Temperatura a converter</label>
                        <input type="number" id="temperatura" class="form-control" placeholder="Insira a temperatura" step="any" required>
                    </div>
                    <div class="mb-3">
                        <label for="unidade" class="form-label">Unidade de origem</label>
                        <select name="unidade" id="unidade" class="form-select">
                            <option value="celsius">Celsius</option>
                            <option value="fahrenheit">Fahrenheit</option>
                        </select>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-secondary">CONVERTER</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="scriptGuilherme.js"></script>
</body>
</html>
