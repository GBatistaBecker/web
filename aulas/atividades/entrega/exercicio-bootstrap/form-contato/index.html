<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário de Contato</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
        crossorigin="anonymous"
    />
    </head>
    <body class="d-flex justify-content-center align-items-center vh-100 bg-light">
        <form class="w-100" style="max-width: 400px;">
            <h4 class="mb-4 text-center"> Formulário de Contato</h4>

            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="nome" placeholder="Nome">
                <label for="nome">Nome</label>
            </div>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="E-mail">
                <label for="email">E-mail</label>
            </div>

            <div class="form-floating mb-3">
                <textarea class="form-control" placeholder="Mensagem" id="mensagem" style="height: 120px;"></textarea>
                <label for="mensagem">Mensagem</label>
            </div>
            <div class="d-grid">
                <button type="button" class="btn btn-info" style="color: whitesmoke;">Enviar</button>
            </div>
        </form>
    </body>
</html>
