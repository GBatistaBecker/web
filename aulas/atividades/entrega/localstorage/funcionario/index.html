<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro de funcionários</title>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Cadastro de funcionário</h2>

        <form id="form-funcionario" class="row-g-3">
            <div class="col-md-6">
                <p>Nome completo: </p>
                <input type="text" id="nome" class="form-control" placeholder="Nome Completo" required>
            </div>
            <div class="col-md-6">    
                <p>Cargo do funcionário: </p>
                <input type="text" id="cargo" class="form-control" placeholder="Cargo" required>
            </div>
            <div class="col-md-6">
                <p>Departamento do funcionário: </p>
                <input type="text" id="departamento" class="form-control" placeholder="Departamento" required>
            </div>
            <div class="col-md-6">
                <p>Salario: </p> 
                <input type="number" id="salario" class="form-control" required>
            </div>    

            <div class="col-md-6">
                <button type="submit" class="btn btn-success w-100">Cadastrar Funcionário</button>
            </div>
        </form>

            <h3 class="mt-5">Lista de Funcionarios</h3>
        <div id="lista-funcionario" class="funcionario border rounded p-3 bg-white shadow-sm mt-3">
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
