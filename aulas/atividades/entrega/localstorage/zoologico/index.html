<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de animais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4">

    <div class="container">
        <h2 class="mb-4">Cadastro de Animal</h2>

            <form id="form-animal" class="row g-3">
                <div class="col-md-6">
                    <input type="text" id="nome" class="form-control" placeholder="Nome do animal" required>
                </div>
                <div class="col-md-6">
                    <input type="text" id="especie" class="form-control" placeholder="Espécie do animal" required>
                </div>
                <div class="col-md-6">
                    <input type="number" id="idade" class="form-control" placeholder="Idade do animal" required>
                </div>
                <div class="col-md-6">
                    <input type="text" id="habitat" class="form-control" placeholder="Habitat do animal" required>
                </div>
                <div class="col-md-6">
                    <button type="submit" class="btn btn-primary w-100">Cadastrar Animal</button>
                </div>
                <div class="col-md-6">
                    <button type="button" id="deletar" class="btn btn-danger w-100">Resetar cadastros</button>
                </div>
            </form>

        <h3 class="mt-5">Lista de Animais Cadastrados</h3>
        <div id="lista-animais" class="animal border rounded p-3 bg-white shadow-sm mt-3">
        </div>
        
    </div>

    <script src="index.js"></script>
</body>
</html>
