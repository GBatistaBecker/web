<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML com JS 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" 
        crossorigin="anonymous">
</head>
<body>
    
    <input type="number" id="primeiroNumero" placeholder="Digite um número">
    <input type="number" id="segundoNumero" placeholder="Digite outro número">
    <button class="btn btn-primary" onclick="somar()">Clique aqui para somar</button>
    <br>
    <br>

    <input type="number" id="primeiroNumeroMulti" placeholder="Digite um número">
    <input type="number" id="segundoNumeroMulti" placeholder="Digite outro número">
    <button class="btn btn-primary" onclick="multiplica()">Clique aqui para multiplicar</button>
    <br>
    <br>

    <input type="number" id="primeiroNumeroDivisao" placeholder="Digite um número">
    <input type="number" id="segundoNumeroDivisao" placeholder="Digite outro número">
    <button class="btn btn-primary" onclick="divisao()">Clique aqui para dividir</button>
    <br>
    <br>

    <input type="number" id="primeiroNumeroSub" placeholder="Digite um número">
    <input type="number" id="segundoNumeroSub" placeholder="Digite outro número">
    <button class="btn btn-primary" onclick="subtracao()">Clique aqui para subtrair</button>
    <br>
    <br>

    <script src="../aula_javascript/index.js"></script>
</body>
</html>
