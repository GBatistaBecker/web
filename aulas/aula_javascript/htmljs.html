<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html JS</title>
</head>
<body>
    <h1 class="text-center">Bem vindo ao HTML com JS</h1>
    <p class="text-muted text-center">Mostrando um exemplo de JS na prática</p>
    <button class="btn btn-primary" onclick="saudacao()">
        Clique aqui para ver a mensagem
    </button>
    <script>
        function saudacao() {
            console.log("Hello world");
            window.alert("Hello world");
        }
    </script>
</body>
</html>
