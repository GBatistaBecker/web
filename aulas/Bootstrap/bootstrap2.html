<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boot Strap + html</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" 
        crossorigin="anonymous">
</head>
<body>
    <h1 class="text-center">Bem vindo ao Bootstrap</h1>

    <p class="text-muted text-center">
        Este é um exemplo simples de boostrap
    </p>

    <div class="container">
        <div class="row">
            <div class="col-md4 bg-danger text-white">1</div>
            <div class="col-md4 bg-warning text-dark">2</div>
            <div class="col-md4 bg-success text-white">3</div>
        </div>
    </div>
    <br />
   <div class="d-flex justify-content-center mt-4">
    <div class="card" style="width: 18rem;">
        <img src="https://i.pinimg.com/originals/1d/bb/78/1dbb780ca6db65d14299d6105646aba6.jpg"
             class="card-img-top"
             alt="imagem">
        <div class="card-body text-center">
            <h5 class="card-title">Gato fumante de óculos escuro</h5>
            <p class="card-text">Não fume</p>
            <a href="#" class="btn btn-primary">Mas o gato ficou maneiro</a>
        </div>
    </div>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" 
        crossorigin="anonymous"></script>
</body>
</html>
